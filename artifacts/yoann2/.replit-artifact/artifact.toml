kind = "mobile"
previewPath = "/"
title = "Yoann2.0"
version = "1.0.0"
id = "artifacts/yoann2"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24240

[services.development]
run = "pnpm --filter @workspace/yoann2 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yoann2", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/yoann2", "run", "serve" ]

[services.env]
PORT = "24240"
BASE_PATH = "/"
